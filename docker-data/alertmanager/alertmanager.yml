# Alertmanager 告警通知配置
# 通知通道通过环境变量 ALERT_WEBHOOK_URL 注入（支持钉钉/企业微信/自定义 Webhook）
global:
  # 默认 SMTP 配置（按需启用）
  # smtp_smarthost: 'smtp.qq.com:465'
  # smtp_from: 'alert@vibemusic.com'
  # smtp_auth_username: '${SMTP_USER}'
  # smtp_auth_password: '${SMTP_PASS}'

# 告警路由
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-fallback'

receivers:
  # 默认：仅日志输出
  - name: 'webhook-fallback'

  # Webhook 通知（通过 ALERT_WEBHOOK_URL 环境变量注入，支持钉钉/企业微信等）
  # docker-compose 中设置: ALERT_WEBHOOK_URL=https://oapi.dingtalk.com/robot/send?access_token=xxx
  # 配置后取消下面注释，并将 route.receiver 改为 'webhook'
  # - name: 'webhook'
  #   webhook_configs:
  #     - url: '${ALERT_WEBHOOK_URL}'
  #       send_resolved: true

  # 钉钉机器人
  # - name: 'dingtalk'
  #   webhook_configs:
  #     - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
  #       send_resolved: true

  # 企业微信
  # - name: 'wecom'
  #   webhook_configs:
  #     - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY'
  #       send_resolved: true

  # 邮件
  # - name: 'email'
  #   email_configs:
  #     - to: 'admin@vibemusic.com'
  #       headers:
  #         Subject: '【vibeMusic 告警】{{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
