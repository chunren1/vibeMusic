# Prometheus 全局配置
global:
  scrape_interval: 15s          # 每 15s 抓取一次指标
  evaluation_interval: 15s      # 每 15s 评估一次告警规则

# 告警规则文件
rule_files:
  - "alert-rules.yml"

# Alertmanager 已移除（空 receiver 从不投递，告警规则仅在界面可见）。
# 如需恢复通知链路：新增 alertmanager 服务与 receiver 配置后，取消下面注释。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# 抓取目标
scrape_configs:
  # ── Spring Boot 后端 ──
  - job_name: 'vibemusic-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'backend:8080'                # [Docker 部署] 通过容器名访问
        labels:
          service: 'spring-boot'
          application: 'vibemusic-backend'

  # ── musicapi Express 网关 ──
  - job_name: 'musicapi'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'musicapi:3000'               # [Docker 部署] 通过容器名访问
        labels:
          service: 'express-bff'

  # ── Prometheus 自身 ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Redis Exporter ──
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # NOTE：宿主机指标（node-exporter）与站点黑盒探活（blackbox-exporter）由本机
  # monitoring/ 栈负责（云服务器 1.6G 内存，跑不了 Prometheus/Grafana，见 RUNBOOK）。
  # 本文件在云上不会被执行（云上不启动 prometheus 服务），仅在本地开发栈生效。
