# Prometheus 全局配置
global:
  scrape_interval: 15s          # 每 15s 抓取一次指标
  evaluation_interval: 15s      # 每 15s 评估一次告警规则

# 告警规则文件
rule_files:
  - "alert-rules.yml"

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 抓取目标
scrape_configs:
  # ── Spring Boot 后端 ──
  # 🔄 部署时切换：本地开发用 host.docker.internal，Docker 部署用 backend
  - job_name: 'vibemusic-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # [本地开发] 宿主机运行的 backend
        # - 'backend:8080'                # [Docker生产] 取消注释这行，注释掉上面那行
        labels:
          service: 'spring-boot'
          application: 'vibemusic-backend'

  # ── musicapi Express 网关 ──
  # 🔄 部署时切换：本地开发用 host.docker.internal，Docker 部署用 musicapi
  - job_name: 'musicapi'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'   # [本地开发] 宿主机运行的 musicapi
        # - 'musicapi:3000'               # [Docker生产] 取消注释这行，注释掉上面那行
        labels:
          service: 'express-bff'

  # ── Prometheus 自身 ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── MySQL Exporter ──
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # ── Redis Exporter ──
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
