# Prometheus 告警规则 —— 2026-10-27 清空（27 条 → 0 条）
#
# 为什么全删：这 27 条规则**一条都不会触发**，三类原因：
#   1) 14 条依赖后端 /actuator/prometheus（jvm_* / hikaricp_* / http_server_* / process_* /
#      musicapi_cookie_*）：导出器已于 2026-10-26 移除，没有数据源。
#   2) 10 条依赖 musicapi /metrics 或 up{job="..."}（搜索成功率与时延、播放/登录失败率、
#      缓存命中率、BackendDown / MusicApiDown / PrometheusDown / RedisDown）：
#      Prometheus 从未部署，没有采集方。
#   3) 3 条依赖 blackbox-exporter / node-exporter（SiteDown / SslCertExpiringSoon /
#      DiskSpaceCritical）：这两个 exporter 从未部署过。
#
# 保留「注释掉的规则」比删掉更危险——规则还在，就会有人以为它在守。
#
# 唯一仍在运行的告警通道 = scripts/health-alert.sh（cron 每分钟 → Server酱）。
# 原本唯一每天在用的 4 条（网易主/备 Cookie、QQ Cookie）已改写为该脚本第 5 节的 HTTP 探活，
# 覆盖「网易备 Cookie 已死、每 15 分钟打 ERROR 却没人知道」这类真实问题，零额外进程零内存。
#
# 要恢复 Prometheus 监控（当前**不部署**，判断依据见 docs/2026-10-26-project-audit.md）：
#   1. 后端加回 micrometer-registry-prometheus 依赖并放开 /actuator/prometheus；
#   2. 真正部署 prometheus + node-exporter + blackbox-exporter（1.6G 机器约 80MB+）；
#   3. 只重写「有采集方 + 有人看 + 有人处理」的规则，别再抄一份没人跑的表；
#   4. 删掉 health-alert.sh 第 5 节，避免同一故障双重告警。
#
# 本文件留空 groups 是为了让 prometheus.yml 里的 rule_files 引用仍然合法（不因缺文件启动失败）。
#
# 已知偏差（有意不改，别当遗漏）：两份 Grafana 看板仍含 `up{job="vibemusic-backend"}` 等无数据面板
#   docker-data/grafana/provisioning/dashboards/json/vibemusic-observability.json
#   monitoring/provisioning/dashboards/vibemusic-observability.json
# 这两个 Grafana 服务当前都不启动（monitoring/README.md 已写明「按需启动，非生产依赖」），
# 逐个改 515 行 JSON 有改坏 provisioning 的风险、收益为零；恢复监控时随规则一起重写。
groups: []
