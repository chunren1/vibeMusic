# Prometheus 告警规则
#
# 通知渠道：Alertmanager 已移除（空 receiver 从不投递）。当前告警只在 Prometheus/Grafana
# 界面可见；需要真实触达时用 scripts/ops/cookie-monitor.py 同款 Server酱通道或 webhook 自建。
#
# 规则只使用主栈实际抓取的指标（jobs: vibemusic-backend / musicapi / prometheus / redis）。
# 依赖 node-exporter（node_filesystem_*、cpu/mem/磁盘）或 cAdvisor（container_*）的规则
# 已移除；若后续在主栈部署这些 exporter，可按需要恢复对应规则。
groups:
  # ── 服务可用性告警 ──
  - name: service-alerts
    rules:
      # 后端服务宕机
      - alert: BackendDown
        expr: up{job="vibemusic-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "后端服务宕机"
          description: "vibemusic-backend 已离线超过 1 分钟"

      # musicapi 网关宕机
      - alert: MusicApiDown
        expr: up{job="musicapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "musicapi 网关宕机"
          description: "musicapi Express 网关已离线超过 1 分钟"

      # Prometheus 自身宕机
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus 监控宕机"
          description: "Prometheus 自身已离线超过 1 分钟"

  # ── 基础设施资源告警 ──
  # NOTE(最小闭环)：磁盘（node_filesystem_*）与容器内存/CPU（container_*）规则需要
  # node-exporter / cAdvisor，主栈未部署对应 exporter，保留会永不触发（死规则），故移除。
  - name: infrastructure-alerts
    rules:
      # 文件描述符使用率过高（> 80%）——micrometer FileDescriptorMetrics（Linux 有效）
      - alert: HighFdUsage
        expr: (process_files_open_files / process_files_max_files) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "文件描述符使用率过高"
          description: "进程文件描述符使用率超过 80%，当前值: {{ $value | printf \"%.1f\" }}%"

  # ── JVM 运行时告警 ──
  - name: jvm-alerts
    rules:
      # JVM 堆内存使用率超过 85%（按 area 汇总，避免 Eden/Old 单池比例误报）
      - alert: HighJvmMemoryUsage
        expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "JVM 堆内存使用率超过 85%，持续 5 分钟，当前值: {{ $value | printf \"%.1f\" }}%"

      # JVM 非堆内存占用过高（Metaspace/CodeCache/DirectMemory）
      # 注：nonheap 的 jvm_memory_max_bytes 多为 -1（无上限），用比值恒不触发，故改用绝对阈值
      - alert: HighJvmNonHeapMemoryUsage
        expr: sum(jvm_memory_used_bytes{area="nonheap"}) > 400 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 非堆内存占用过高"
          description: "非堆内存占用超过 400MB 持续 10 分钟（Metaspace/CodeCache/DirectMemory），需排查类加载或直接内存"

      # GC 频繁（全量 GC 事件 > 10 次/秒）
      # 注：jvm_gc_pause_seconds 的标签是 action/cause，没有 area，原 area="heap" 过滤后无序列
      - alert: HighGcFrequency
        expr: rate(jvm_gc_pause_seconds_count[1m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM GC 频繁"
          description: "GC 事件频率超过 10 次/秒，可能存在内存压力或对象分配过快"

      # Old GC 单次耗时过长（> 1秒）
      # 注：histogram_quantile 需要 _bucket；jvm.gc.pause 的桶默认不开启，改用始终存在的 _max
      - alert: LongOldGcDuration
        expr: jvm_gc_pause_seconds_max{action="end of major GC"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM Old GC 耗时过长"
          description: "Old GC 单次最长耗时超过 1 秒，可能导致明显停顿"

      # 线程数过多（> 500）
      - alert: HighThreadCount
        expr: jvm_threads_live_threads > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 线程数过多"
          description: "JVM 存活线程数超过 500，可能存在线程泄漏"

  # ── 数据库连接池告警 ──
  - name: datasource-alerts
    rules:
      # HikariCP 连接池使用率超过 85%
      - alert: HikariPoolUsageHigh
        expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池使用率过高"
          description: "HikariCP 活跃连接数占比超过 85%，当前值: {{ $value | printf \"%.1f\" }}%"

      # HikariCP 连接获取等待时间过长（> 1秒）
      # 注：hikaricp_connections_acquire_seconds 默认无直方图桶，改用始终存在的 _max
      - alert: HikariPoolAcquireSlow
        expr: hikaricp_connections_acquire_seconds_max > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接获取耗时过长"
          description: "HikariCP 单次获取连接最长耗时超过 1 秒，连接池可能不足"

      # 连接泄漏检测（持续有线程等待获取连接）
      - alert: HikariPoolLeakDetected
        expr: hikaricp_connections_pending > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "数据库连接池疑似泄漏"
          description: "有连接等待获取超过 leakDetectionThreshold，疑似连接泄漏"

  # ── 线程池告警 ──
  # NOTE(O6): ThreadPoolConfig registers no executor_queue_size / executor_rejected_tasks_total
  # meters — SearchThreadPoolQueueBacklog / SearchThreadPoolRejected removed until such
  # meters exist. No Java code added here.
  - name: threadpool-alerts
    rules: []

  # ── 缓存告警 ──
  - name: cache-alerts
    rules:
      # 缓存命中率低于 30%（5分钟内 API 穿透占比过高）
      - alert: LowCacheHitRate
        expr: |
          (rate(cache_miss_api_total[5m]) /
           (rate(cache_hit_redis_total[5m]) + rate(cache_miss_api_total[5m]))) > 0.7
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "缓存命中率偏低"
          description: "API 穿透率超过 70%，缓存命中率持续偏低，可能存在缓存失效问题"

      # Redis（经 redis-exporter 抓取）不可达
      # 注：redis_exporter 并不暴露 redis_connection_failures_total，用 up 判定确定性可达
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可达"
          description: "redis-exporter 目标连续 1 分钟不可抓取，Redis 可能已停止或网络异常"

  # ── 业务 SLA 告警 ──
  - name: business-sla-alerts
    rules:
      # 搜索成功率低于 99%
      - alert: SearchSuccessRateLow
        expr: |
          (rate(http_server_requests_seconds_count{uri="/api/songs/search",status=~"2.."}[5m]) /
           rate(http_server_requests_seconds_count{uri="/api/songs/search"}[5m])) * 100 < 99
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "搜索接口成功率过低"
          description: "搜索 API 成功率低于 99%，当前值: {{ $value | printf \"%.2f\" }}%"

      # 播放失败率超过 1%
      - alert: PlayFailureRateHigh
        expr: |
          (rate(http_server_requests_seconds_count{uri="/api/songs/stream",status=~"5.."}[5m]) /
           rate(http_server_requests_seconds_count{uri="/api/songs/stream"}[5m])) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "音频流播放失败率过高"
          description: "播放接口 5xx 错误率超过 1%，当前值: {{ $value | printf \"%.2f\" }}%"

      # 登录失败率异常（> 5%）
      - alert: LoginFailureRateHigh
        expr: |
          (rate(http_server_requests_seconds_count{uri="/api/auth/login",status=~"4.."}[5m]) /
           rate(http_server_requests_seconds_count{uri="/api/auth/login"}[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "登录失败率异常"
          description: "登录接口 4xx 错误率超过 5%，可能存在暴力破解或服务异常"

      # API 平均响应时间超过 2 秒（用 _sum/_count 计算真实均值；http.server.requests 默认无直方图桶）
      - alert: ApiAvgLatencyHigh
        expr: |
          (rate(http_server_requests_seconds_sum[5m]) /
           rate(http_server_requests_seconds_count[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 平均响应时间过高"
          description: "整体 API 平均响应时间超过 2 秒"

  # ── 性能告警 ──
  - name: performance-alerts
    rules:
      # 搜索 P95 延迟超过 1 秒
      - alert: HighSearchLatency
        expr: histogram_quantile(0.95, rate(search_latency_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "搜索延迟过高"
          description: "搜索 P95 延迟超过 1 秒，持续 5 分钟"
