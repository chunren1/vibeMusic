# 博客站点（Astro 静态产物），Cloudflare → cloudflared → nginx:80
#
# 云上路径：/etc/nginx/sites-enabled/testweb（sites-available/ 同名副本，两边一起改）
#
# 2026-11-06 修正：此前该站一个安全头都没有（含 HSTS）。
#   根因：每个 location 都写了 add_header Cache-Control，nginx 不再继承
#   http 级 conf.d/security.conf 的 add_header → 5 条安全头全部被丢。
#   修法：server 级 + 每个自带 add_header 的 location 都 include 安全头片段。
#   同时把 `expires 1y; add_header Cache-Control ...` 的双写合并成单条，
#   避免响应里出现两个 Cache-Control（线上被 Cloudflare 合并成
#   "public, max-age=31536000, immutable"，合并后语义与现在完全一致）。
server {
    absolute_redirect off;
    listen 80;
    server_name cyk666.top www.cyk666.top;

    limit_req zone=one burst=20 nodelay;
    limit_conn addr 10;
    client_max_body_size 10m;

    root /var/www/testweb-dist-new;
    index index.html;

    # server 级兜底：将来新增的 location 若自己不加 add_header，可继承到这里。
    include /etc/nginx/snippets/security-headers.conf;

    # 带内容哈希的构建产物：可长缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Astro 内容路由：/articles/foo.html → /articles/foo/index.html
    location ~ ^/articles/(?!.*index\.html$)(.+)\.html$ {
        try_files /articles/$1/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /articles/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 无哈希的散装图片/图标：30 天（单条 Cache-Control，不再用 expires 双写）
    location ~ \.(ico|svg|jpg|jpeg|png|webp|gif)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
