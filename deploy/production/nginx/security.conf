# 安全头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 2026-11-10：站点是私人音乐服务，API 与页面都不该被搜索引擎收录
add_header X-Robots-Tag "noindex, nofollow" always;
# HSTS：强制浏览器后续只走 HTTPS（2026-10-26 审计补：此前缺失）
# 注意：一旦下发 max-age，回退需要等浏览器过期；先给 1 年，includeSubDomains 不含 preload。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 限制请求速率（防刷）
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/s;

# 认证接口独立限流（2026-11-06 补）：登录/注册此前没有任何限流，可被无限次爆破口令。
# 10 次/分钟 + burst 5：正常人登录远用不到，脚本爆破基本被压到 10 次/分钟。
# 计数按真实访客 IP（cloudflare-realip.conf 已用 CF-Connecting-IP 还原），不会把整个 CF 边缘算成一个来源。
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# 限制连接数
limit_conn_zone $binary_remote_addr zone=addr:10m;

# 限流拒绝用 429（默认 503 会被误判成服务故障，2026-10-26 审计补）
limit_req_status 429;
limit_conn_status 429;
