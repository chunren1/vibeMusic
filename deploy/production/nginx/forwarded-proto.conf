# 真实协议还原（2026-11-04 建立）
#
# 背景：链路是 Cloudflare(https) → cloudflared → nginx(127.0.0.1:8081, http) → 后端。
#       nginx 侧 $scheme 恒为 http，若用它覆盖 X-Forwarded-Proto，后端两个判断
#       （request.isSecure() 与 "https".equals(X-Forwarded-Proto)）都为假，
#       Set-Cookie 便不会带 Secure —— 线上 Cookie 缺 Secure 的根因。
#
# 取值：Cloudflare 会把 X-Forwarded-Proto 改写为访客的真实协议，优先采用；
#       没有该头时（本机直连 8081 调试）回落到 $scheme，避免误标 https。
#
# 生效条件：vibemusic-site.conf 的 proxy_set_header X-Forwarded-Proto $fwd_proto;
# 注意：map 只能在 http 上下文，本文件需放在 /etc/nginx/conf.d/ 下（与 security.conf 同级）。

map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
