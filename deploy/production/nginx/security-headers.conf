# 安全头片段（2026-11-06 建立）
#
# 云上路径：/etc/nginx/snippets/security-headers.conf
#
# 为什么需要它：nginx 的 add_header 采用「整层覆盖」继承规则——
#   只要当前层出现任意一条 add_header，就完全不继承上层（http/server）的 add_header。
#   博客站（cyk666.top）每个 location 都写了 add_header Cache-Control，
#   导致 http 级 conf.d/security.conf 里的 5 条安全头被静默丢弃（实测线上一个都没有，含 HSTS）。
#   所以凡是「自己 add_header 的 location」都必须 include 本片段。
#
# 注意：本片段与 conf.d/security.conf 的 5 条安全头保持同值；
#       以后改 HSTS 时长/增删头，两个文件要一起改（security.conf 供 vibemusic 站继承）。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
