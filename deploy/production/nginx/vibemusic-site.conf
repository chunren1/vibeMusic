# vibeMusic 前端静态 + /api 反代到 WSL 后端（SSH 反向隧道）
#
# 2026-10-19 缓存策略修正（线上真身 /etc/nginx/sites-enabled/vibemusic，改后与仓库副本逐字节一致）：
#   - /assets/**          7d public            → 1 年 immutable（Vite 产物 152/152 全带内容哈希）
#   - index.html          无缓存头（启发式缓存）→ no-cache, no-store, must-revalidate（防白屏）
#   - 散装静态文件(logo 等) 7d public            → no-cache（换图立即生效）
#   - sw.js               expires -1 + add_header 双写 Cache-Control → 只留 add_header（消重复头）
#   - manifest.json       无任何缓存头（启发式缓存）  → no-cache, no-store, must-revalidate
#                         + MIME application/json → application/manifest+json（规范/IANA 注册值）
#
# 坑：nginx 的 add_header 只在「当前层没有任何 add_header」时才继承上层，
#     因此凡自己 add_header 的 location 都必须手工补回 security.conf 里的 4 个安全头，
#     否则这些路径上的安全头会被静默丢掉（改前 /assets、/sw.js 就是丢的）。
server {
    listen 127.0.0.1:8081;
    server_name vibe.cyk666.top;

    root /var/www/vibemusic;
    index index.html;

    # 前端静态资源（SPA 路由兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 哈希静态资源：文件名自带内容哈希，可安全长缓存。
    # ^~ 优先级高于下面按扩展名的正则 location → /assets/*.js|css|png|svg 全部命中这里。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 入口 HTML：禁缓存。旧 index.html 会引用新构建已删除的旧 hash 资源 → 白屏。
    # 注意：`location /` 的 try_files 末参 `/index.html` 与目录 index 都会内部重定向到本块，
    # 所以直接访问 `/` 或任意前端路由都受这里保护。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 用户上传（头像/背景）：反代到后端 Spring 静态资源
    #
    # proxy_hide_header 去重（2026-10-23）：后端 Spring Security 自己会发
    # X-Frame-Options: DENY 和 X-Content-Type-Options: nosniff，与 security.conf 的
    # SAMEORIGIN/nosniff 叠加后响应里出现两个值——X-Frame-Options 冲突（DENY vs
    # SAMEORIGIN）比缺失更糟：部分浏览器取第一个值，等于把「同源可嵌入」变成「谁都不能嵌入」。
    # 统一以 nginx 的为准（可预期、与前端的静态路径一致）。
    location ^~ /uploads/ {
        proxy_pass http://vibemusic_backend;
        # 必须显式设 Host：proxy_pass 用 upstream 名时，nginx 默认发 Host: $proxy_host，
        # 即 "vibemusic_backend"。Tomcat 的 Host 校验拒绝含下划线的域名
        # （IllegalArgumentException: The character [_] is never valid in a domain name）→ 整个 /uploads 400。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    # API 反代到 WSL backend（反向隧道 8080）
    # 注意：proxy_pass 用 upstream 名（不是固定端口），蓝绿部署只改
    # /etc/nginx/conf.d/vibemusic-backend-upstream.conf 里的 server 端口 + reload。
    location /api/ {
        proxy_pass http://vibemusic_backend;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Service Worker：禁止缓存，确保浏览器能及时拉取新版本
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # PWA 清单：同属「无内容哈希的元数据文件」，禁缓存（否则换名/换图标延迟生效）。
    # 用精确匹配而不是把 json 塞进下面那条正则：nginx 正则 location 优先级高于前缀 location，
    # 那样会把 /api/**.json 之类的请求截胡成静态文件查找（=404），故必须单列。
    location = /manifest.json {
        # MIME：nginx 默认把 .json 映射成 application/json；规范（W3C / IANA 注册）建议发
        # application/manifest+json。浏览器两者都认（MDN：「generally support ... .json」），此处取规范值。
        # location 级 types 覆盖继承的 mime.types —— 只作用于这条精确匹配，不影响别处（/api 等）。
        types { application/manifest+json json; }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 无哈希的散装静态文件（logo.png / favicon.ico 等）：不能长缓存，否则换图后一周不生效。
    # 必须是 no-store：实测（2026-10-19）Cloudflare 会把「缺 no-store 的可缓存扩展名」响应头
    # 改写成 max-age=604800（即使加随机查询串全新取也照改）；带 no-store 则原样透传。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
}
