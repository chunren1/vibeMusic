x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-resources-small: &resources-small
  mem_limit: 256M
  cpus: 0.5

services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: monitor-blackbox
    restart: "no"
    logging: *default-logging
    <<: *resources-small
    command:
      - '--config.file=/config/blackbox.yml'
      - '--web.listen-address=0.0.0.0:9115'
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: monitor-prometheus
    restart: "no"
    logging: *default-logging
    <<: *resources-small
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=0.0.0.0:9090'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docker-data/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: monitor-grafana
    restart: "no"
    logging: *default-logging
    <<: *resources-small
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://127.0.0.1:3001}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-127.0.0.1}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-vibemusic}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro

volumes:
  prometheus-data:
  grafana-data: