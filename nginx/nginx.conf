# ============================================================
# vibeMusic Nginx 配置 — 生产级
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========== 日志 ==========
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 200;
    types_hash_max_size 2048;

    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # ========== Gzip ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/html text/plain text/css text/xml
               application/json application/javascript application/xml+rss
               image/svg+xml application/wasm font/woff2 font/woff;

    # ========== Docker DNS ==========
    resolver 127.0.0.11 valid=30s;

    # ========== 限流（API 防刷） ==========
    # 使用 X-Forwarded-For 代替 binary_remote_addr（反代下 binary_remote_addr 始终为 Nginx IP）
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    limit_req_zone $http_x_forwarded_for zone=api_limit:10m rate=10r/s;
    limit_req_zone $http_x_forwarded_for zone=auth_limit:10m rate=3r/s;
    limit_conn_zone $http_x_forwarded_for zone=conn_limit:10m;

    # ========== 后端连接池 ==========
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # ========================================================
    # HTTP → 强制跳转 HTTPS
    # ========================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ========================================================
    # HTTPS 主站
    # ========================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # ====== TLS 证书 ======
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ====== TLS 安全配置 ======
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ====== 安全响应头 ======
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

        # ---------- 前端静态资源 ----------
        root /usr/share/nginx/html;
        index index.html;

        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /sw.js {
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache";
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 1d;
            add_header Cache-Control "public, max-age=86400, must-revalidate";
        }

        # ---------- Spring Actuator：拒绝外部访问，仅 Prometheus 内部抓取 ----------
        location /actuator/ {
            return 403;
        }

        # ---------- API 反向代理（限流） ----------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 20m;
        }

        # ---------- 登录/注册接口更严格的限流 ----------
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ---------- 音频流代理（无限流、无缓冲） ----------
        location /api/songs/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_pass_header Content-Range;
            proxy_pass_header Accept-Ranges;
            proxy_pass_header Content-Type;
            proxy_pass_header Content-Length;
        }

        # ---------- SPA fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}
