# Demo 轻量（体验一致，仅调优看不见的内存，全量代码不动）
# MinIO 已去掉：下载走 StreamController proxy_cache 直连 p3.music.126.net/y.gtimg.cn
# MySQL 保留但瘦身：innodb 128M + Hikari 5/2，140M
# 5 服务：nginx(64M) + backend(768M) + musicapi(128M) + redis(128M) + mysql(140M) ≈1.2G（2026-10-10 以云为基线回同步后更新）
services:
  mysql:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # 云上实际跑的就是 8.4（2026-10-29 对齐：此前仓库写 8.0，与线上不符）
    image: mysql:8.4
    container_name: vibemusic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required see .env.example}
      MYSQL_DATABASE: vibemusic
      # 供 02-users.sh 建号使用：与 backend 共用同一份口令，避免两处各写一遍
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required see .env.example}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD is required see .env.example}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./docker-data/mysql/data:/var/lib/mysql
      - ./vibeMusic-backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      # 首次初始化建号：vibemusic(DML) / vibemusic_migrator(DML+DDL)（可选 vibemusic_backup 只读）
      - ./vibeMusic-backend/sql/init-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --slow_query_log=ON
      - --long_query_time=1
    mem_limit: 768M
    cpus: 0.5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required see .env.example}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vibemusic-net]

  redis:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    image: redis:7-alpine
    container_name: vibemusic-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - ./docker-data/redis/data:/data
      - ./docker-data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    mem_limit: 128M
    cpus: 0.3
    networks: [vibemusic-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  musicapi:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    build:
      context: ./musicapi
      dockerfile: Dockerfile
    image: vibemusic-musicapi:latest
    container_name: vibemusic-musicapi
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Node 在容器里看不到 cgroup 限制，V8 默认按**宿主**内存推导堆上限：
      # 宿主 1608MB → heap_size_limit 实测 259MB，而 mem_limit 只有 128M。
      # 于是 V8 觉得宽裕、迟迟不 GC，进程先被 cgroup OOM kill（无 GC 机会、无异常日志）。
      # 显式压到 96MB（≈ limit 的 75%）让它按 128M 的世界观回收。
      # 实测依据：heap_used 24.5MB / heap_total 30.2MB / RSS 55MB（2026-10-26 采样 6 次稳定），
      # 96MB 有约 4 倍余量，不会造成「heap out of memory」。
      NODE_OPTIONS: --max-old-space-size=96
      MUSIC_QQ_COOKIE: ${MUSIC_QQ_COOKIE:-{}}
      MUSIC_NETEASE_COOKIE: ${MUSIC_NETEASE_COOKIE:-}
      MUSIC_NETEASE_COOKIE_BACKUP: ${MUSIC_NETEASE_COOKIE_BACKUP:-}
      KUGOU_GUID: ${KUGOU_GUID:-}
      KUGOU_MID: ${KUGOU_MID:-}
      KUGOU_DFID: ${KUGOU_DFID:--}
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 128M
    cpus: 0.3
    networks: [vibemusic-net]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 一次性迁移容器（2026-10-29）───────────────────────────────────────────
  # 为什么单独一个服务：migrator 账号有 DDL 权限。它一旦作为环境变量注进**长期运行**的
  # backend 容器，应用被 RCE 后读 /proc/self/environ 就能拿到 DDL 凭证，「最小权限」只是纸面。
  # 拆成一次性容器后：迁移跑完即退，backend 只留 DML 账号，「被攻破也改不了表结构」才成立。
  #
  # 为什么复用 backend 镜像而不是 flyway/flyway：迁移 SQL 在 jar 的 db/migration 里，
  # 用 flyway 镜像就得挂载一份目录 —— 挂载目录和 jar 内谁是真源没人天天核对，等于新增漂移源。
  # 这里只换入口（FlywayOnlyApplication 仅 import DataSource + Flyway，跑完 exit）。
  # ⚠️ 存量数据卷（账号还是旧的那套）先跑 ./scripts/create-db-users.sh，否则这里 Access denied
  #    并因为 depends_on 把 backend 一起拦住（initdb 只在空卷执行，老卷不会自动建号）。
  flyway-init:
    build:
      context: ./vibeMusic-backend
      dockerfile: Dockerfile
    image: vibemusic-backend:latest
    container_name: vibemusic-flyway-init
    # 一次性：退出码非 0 时 backend 的 depends_on 会拦住启动
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      # DataSource 用运行账号（Flyway 的 DDL 走下面的 SPRING_FLYWAY_*），语义与线上一致
      DB_USERNAME: ${DB_USERNAME:-vibemusic}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required see .env.example}
      SPRING_FLYWAY_USER: ${FLYWAY_USER:-vibemusic_migrator}
      SPRING_FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD is required see .env.example}
      SPRING_PROFILES_ACTIVE: docker
      # 迁移容器不跑业务，堆/元空间给足余量即可（云上 1.6G，必须能和后端串行共存）
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC"
    entrypoint:
      - sh
      - -c
      # $$ 必须双写：compose 会把 $VAR 当宿主环境变量插值（单写会变成空串，JVM 参数全丢，
      # 实测 2026-10-29：单写时构建日志刷 `The "JAVA_OPTS" variable is not set`，容器内 java 无任何 -XX 参数）
      - exec java $$JAVA_OPTS -Dloader.main=com.vibemusic.bootstrap.FlywayOnlyApplication -cp app.jar org.springframework.boot.loader.launch.PropertiesLauncher
    mem_limit: 256M
    cpus: 0.5
    networks: [vibemusic-net]
    depends_on:
      mysql: {condition: service_healthy}

  backend:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    build:
      context: ./vibeMusic-backend
      dockerfile: Dockerfile
    image: vibemusic-backend:latest
    container_name: vibemusic-backend
    restart: unless-stopped
    environment:
      # 时区必须与 mysql 容器一致（mysql 是 CST）。Java 用 LocalDateTime.now() 写
      # play_history.played_at / updated_at，created_at 走 DB 默认值；两边不一致 = 差 8 小时。
      # 2026-10-26 线上事故：backend 未声明 TZ（UTC）而 mysql 是 CST，「最近播放」时间全错。
      TZ: Asia/Shanghai
      DB_HOST: mysql
      # 运行账号只给 DML（2026-10-29 拆分）；DDL 归 migrator，且只在 flyway-init 一次性容器里用
      DB_USERNAME: ${DB_USERNAME:-vibemusic}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required see .env.example}
      # 迁移已拆到独立的 flyway-init 服务（见本文件 flyway-init 段）：本容器**不再持有 migrator 凭证**，
      # DDL 只在那台一次性容器里发生 —— 于是「后端被攻破也改不了表结构」才真正成立。
      # 这里必须显式关闭自动迁移：否则有人绕过 flyway-init 直接起 backend 时，Flyway 会静默跳过
      # （运行账号没有 DDL，真跑起来反而会失败得更晚、更难懂）。
      SPRING_FLYWAY_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      ES_URI: "" # ES 已下线：仅占位（空值致启动崩溃，勿改非空）
      MINIO_ENDPOINT: "http://127.0.0.1:9000" # MinIO已下线:仅StorageService-init占位,空值致启动崩溃,勿改空
      MINIO_ACCESS_KEY: "placeholder" # MinIO已下线:仅init占位,勿改空
      MINIO_SECRET_KEY: "placeholder" # MinIO已下线:仅init占位,勿改空
      # 云上 demo 栈无 MinIO：显式关闭对象存储，播放/下载走上游直连代理（本地完整栈才开缓存）
      STORAGE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET} # 必填fail-fast：缺失直接报错，绝不用默认密钥启动（默认密钥全网皆知=伪造token）
      AI_API_KEY: ${AI_API_KEY:-} # 未配置时留空：后端短路返回"未配置"提示，不拿占位值外呼
      MUSICAPI_URL: http://musicapi:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://vibe.cyk666.top,http://localhost:5173}
      STREAM_CDN_WHITELIST: "*.music.126.net,*.gtimg.cn,*.stream.qqmusic.qq.com,*.tc.qq.com,*.tencentmusic.com,*.migu.cn,*.bilivideo.com,*.hdslb.com,*.kugou.com" # 2026-09-14:补B站/酷狗/咪咕(yml旧值缺失致SSRF-403),勿删
      SPRING_PROFILES_ACTIVE: docker
      # JVM_DIAG_OPTS 可临时注入 -Xlog:class+load / -XX:NativeMemoryTracking=detail（默认关闭：生产启动路径上写 19k 行 class 日志、NMT detail 都会拖慢冷启动）
      JAVA_OPTS: "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/uploads/dumps/ -XX:MaxRAMPercentage=60.0 -XX:MinRAMPercentage=30.0 -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=160m -XX:+UseG1GC ${JVM_DIAG_OPTS:-}"
      DB_POOL_MAX_SIZE: 5
      TOMCAT_MAX_THREADS: 50 # 名字必须与 application.yml 的 ${TOMCAT_MAX_THREADS:40} 一致，写成 SERVER_TOMCAT_THREADS_MAX 会静默失效
      DB_POOL_MIN_IDLE: 2
      APP_GUEST_MODE: "true"
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY:-} # 2026-09-14:BYOC-AES-GCM密钥,勿删
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 768M
    # 2026-10-23: 0.5 → 1.5。实测 0.5 核时生产有 19% 的周期被限流（nr_throttled 2546/13355），
    # 启动期 86% 周期被限流（冷启动 136s 里 44s 卡在类加载/bean 初始化）。配额是上限不是预留，
    # 宿主机 2 核、load 0.45，调高只影响峰值时谁先被调度。
    cpus: 1.5
    volumes:
      - ./docker-data/backend/uploads:/app/uploads
    networks: [vibemusic-net]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      musicapi: {condition: service_started}
      # 迁移容器必须先成功退出；失败则 backend 不启动（fail closed，不会带着旧 schema 跑新代码）
      flyway-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 应用启动 3-4 分钟（预热 17 个关键词打外部 API），60s 会让启动中期就报 unhealthy；
      # 180s + 5×15s 容错覆盖整个启动窗口（2026-10-10 部署踩坑后调整）
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    container_name: vibemusic-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./vibemusic-web/dist:/usr/share/nginx/html:ro
      - ./docker-data/nginx/logs:/var/log/nginx
    mem_limit: 64M
    cpus: 0.2
    networks: [vibemusic-net]
    depends_on:
      backend: {condition: service_healthy}

networks:
  vibemusic-net:
    driver: bridge
    name: vibemusic-net
