# vibeMusic Frontend CI
# 自动构建 Vue 3 前端 & 可选 Docker 镜像推送

name: Frontend CI

on:
  push:
    paths: ['vibemusic-web/**', '.github/workflows/frontend-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibemusic-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibemusic-web/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: vibemusic-web/dist/
