# vibeMusic musicapi CI
# 自动校验 Express BFF 网关语法 + 运行集成测试

name: Musicapi CI

on:
  push:
    paths: ['musicapi/**', '.github/workflows/musicapi-ci.yml']
  pull_request:
    paths: ['musicapi/**']

concurrency:
  group: musicapi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: musicapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done

      - name: Prepare config for CI
        run: cp config.example.js config.js

      - name: Start server
        run: |
          node server.js > /tmp/musicapi.log 2>&1 &
          echo $! > /tmp/musicapi.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          cat /tmp/musicapi.log
          exit 1

      - name: Run tests
        run: node --test test/server.test.js

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/musicapi.pid) 2>/dev/null || true
