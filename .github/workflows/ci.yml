# vibeMusic unified CI — single workflow replacing backend-ci / frontend-ci /
# musicapi-ci / test.yml (merged Q2b). 4 parallel test jobs + api-test + infra-lint + docker-build.
#
# 触发与发版闸门（P1 收紧, 2026-10-19）：
#   - main/master push、PR：原样（paths 过滤保持）。
#   - tag v*：本 workflow 也会跑，且**不受 paths 过滤**（GitHub 官方文档：路径过滤对 tag 推送
#     不生效 "Path filters are not evaluated for pushes of tags"）→ 每个 tag commit 都留下
#     完整测试记录（backend/frontend/gateway/api-test/infra-lint/docker-build）。
#   - deploy.yml 内另有硬门禁（测试 + 镜像构建全绿才产出发布产物），tag 上双保险。
#   - 成本口径：tag 是低频事件（发版月级），故 tag 上跑全量含实机冒烟；PR 上不跑 docker-build
#     与 api-test，省分钟数。
name: CI

on:
  workflow_dispatch:   # 手动跑全量（发 tag 前自查）
  push:
    branches: [main, master]
    tags: ['v*']       # tag 推送 → 全量测试（paths 对 tag 不生效，见文件头）
    paths:
      - 'vibeMusic-backend/**'
      - 'vibemusic-web/**'
      - 'musicapi/**'
      - 'api-test/**'
      - 'docker-compose*.yml'
      - 'docker-data/**'
      # nginx / monitoring / scripts 改动此前不触发任何 job（改坏反代配置无人发现）
      - 'nginx/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'vibeMusic-backend/**'
      - 'vibemusic-web/**'
      - 'musicapi/**'
      - 'api-test/**'
      - 'docker-compose*.yml'
      - 'docker-data/**'
      - 'nginx/**'
      - 'monitoring/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job 1: Spring Boot backend (JaCoCo 60% gate runs on `verify`) ----
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibeMusic-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Verify (JaCoCo 60% gate on verify)
        run: mvn -B verify -DskipTests=false
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          # test-only, never production：32 个零字节的 base64 假密钥，仅供测试加载 CookieCryptoService
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Upload Surefire test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: vibeMusic-backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: vibeMusic-backend/target/site/jacoco/
          retention-days: 7

  # ---- Job 1b: 同一套用例在「线上运行时」的 JDK 上再跑一遍 ----
  # 线上 base 镜像已是 eclipse-temurin:25（Dockerfile），但字节码仍编译到 17
  # （pom <java.version>17</java.version>）。此前测试只在 JDK 17 上跑过，
  # 意味着「测试的 JVM」与「运行的 JVM」错位——只在 25 上出现的
  # 反射/模块/GC 行为差异没有任何门禁能拦住。
  # 这里只跑 `test`（不跑 verify）：JaCoCo 70/60 门禁由 Job 1 唯一负责，避免双份覆盖率报告互相覆盖。
  backend-jdk25:
    name: Backend (JDK 25 runtime alignment, tests only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibeMusic-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25 (与线上 runtime 对齐)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests on JDK 25（不含覆盖率门禁）
        run: mvn -B test -DskipTests=false
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          # test-only, never production：32 个零字节的 base64 假密钥，仅供测试加载 CookieCryptoService
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  # ---- Job 2: Vue 3 frontend (build + Vitest) ----
  frontend:
    name: Frontend (Vite build + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vibemusic-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vibemusic-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.cjs" ] || [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ]; then
            echo "ESLint config found, running (hard gate)..."
            npx eslint .
          else
            echo "No ESLint config, skipping (project is pure JS without eslint by design)"
          fi

      - name: Typecheck (vue-tsc, 硬门禁；测试文件由 vitest 覆盖故排除在 checkJs 外——checkJs 无法建模 vi.mock)
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Run tests (Vitest)
        run: npx vitest run --reporter=verbose --coverage

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vibemusic-web/dist/
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: vibemusic-web/coverage/
          retention-days: 7

  # ---- Job 3: Express BFF gateway (offline stub tests, no live server) ----
  # NOTE: test/server.test.js is deliberately excluded — it requires a live
  # server on :3000. All other test files are self-contained (node:test stubs)
  # and run per-file explicitly. 不再加 --test-force-exit：logger 定时器已 unref()，
  # 进程能自然退出；force-exit 会在有句柄泄漏时仍判绿，把泄漏藏起来
  # （2026-10-23 a37056c 已从 npm test 摘掉，此处是同一笔清理的收尾）。
  gateway:
    name: Gateway (node --test, 15 files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: musicapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      # 运行时契约（2026-10-27 审计 P2）：engines / Dockerfile 的 FROM node:<major> /
      # 当前 runner 三处主版本必须一致。此前只有人肉约定，没人核对。
      - name: Guard — node runtime contract (engines ↔ Dockerfile ↔ runner)
        run: node scripts/verify-runtime.mjs

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done

      # 清单漂移守卫：新增网关测试文件却忘记接进 CI 时，这里直接红（历史上发生过 12→14 漏接）。
      # 同时校验 ci.yml / deploy.yml 两处清单与磁盘一致——deploy.yml 的发版门禁复用同一份清单。
      - name: Guard — gateway test list matches disk and both workflows
        working-directory: .
        run: |
          python3 << 'PY'
          import glob, os, re, sys

          root = os.environ.get('GITHUB_WORKSPACE', '.')
          pattern = re.compile(r'test/([\w.\-]+\.test\.js)')

          def listed(rel_path):
              with open(os.path.join(root, rel_path), encoding='utf-8') as fh:
                  # 先剔掉 YAML 注释行，避免注释里提到的文件名（如 "test/server.test.js 需实机故排除"）被误判
                  lines = [ln for ln in fh.read().splitlines() if not ln.lstrip().startswith('#')]
              return set(pattern.findall('\n'.join(lines)))

          on_disk = {os.path.basename(p) for p in glob.glob(os.path.join(root, 'musicapi/test/*.test.js'))}
          excluded = {'server.test.js'}          # 需要实机 :3000，故意排除
          expected = on_disk - excluded
          errors = []
          for wf, label in (('.github/workflows/ci.yml', 'ci.yml'),
                            ('.github/workflows/deploy.yml', 'deploy.yml')):
              found = listed(wf)
              if found != expected:
                  errors.append(f"{label}: 缺 {sorted(expected - found)} / 多 {sorted(found - expected)}")
          if errors:
              for msg in errors:
                  print(f"::error::网关测试清单与磁盘不一致 -> {msg}")
              sys.exit(1)
          print(f"清单一致：{len(expected)} 个测试文件（磁盘 {len(on_disk)} 个，排除 {sorted(excluded)}）")
          PY

      - name: Run gateway tests (per-file, no live server)
        run: |
          node --test test/contract.test.js \
            test/cookie-endpoints-hardening.test.js \
            test/gateway-top10.test.js \
            test/kugou-lyric.test.js \
            test/netease-capability-probe.test.js \
            test/netease-cookie-failover.test.js \
            test/netease-ssrf.test.js \
            test/netease-user-cookie.test.js \
            test/qq-no-cookie.test.js \
            test/search-bili.test.js \
            test/search-cache-key-isolation.test.js \
            test/search-cache-regression.test.js \
            test/search-kugou.test.js \
            test/search-migu.test.js \
            test/search-qq.test.js \
            test/netease-cold-start.test.js \
            test/source-health.test.js \
            test/upstream.test.js \
            test/vip-health-metrics.test.js

  # ---- Job 5: API smoke (pytest vs 实机 backend + mysql + redis + musicapi) ----
  # 非 PR 才跑（push / tag / 手动；省 PR 分钟数）。services 起真 mysql+redis，musicapi 与后端实机启动，
  # 健康检查放行后才跑 pytest；后端不可达时用例 skip 不爆红。
  # 必须起 musicapi：不起则五路 fanout 全空 → 搜索/推荐类用例大面积 skip，
  # job 看着绿但其实没验到搜索链路（无 Cookie 时 QQ 走无 Cookie 正常态、网易降级）。
  api-test:
    name: API smoke (pytest vs live backend)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: vibemusic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api-test/requirements.txt

      - name: Build backend (skip unit tests; gate lives in backend job)
        run: mvn -B -DskipTests package
        working-directory: vibeMusic-backend
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Set up Node 20 (musicapi gateway)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      - name: Start musicapi gateway (no cookies → 上游降级)
        run: |
          npm ci
          nohup node server.js > /tmp/musicapi.log 2>&1 &
          echo $! > /tmp/musicapi.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "musicapi up after ${i}x2s"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::musicapi 未在 60 秒内就绪"
              tail -n 80 /tmp/musicapi.log
              exit 1
            fi
            sleep 2
          done
        working-directory: musicapi

      - name: Start backend against services
        run: |
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/auth/health >/dev/null; then
              echo "backend up after ${i}x5s"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::backend 未在 5 分钟内就绪"
              tail -n 100 /tmp/backend.log
              exit 1
            fi
            sleep 5
          done
        working-directory: vibeMusic-backend
        env:
          SPRING_PROFILES_ACTIVE: docker
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: 123456
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Run pytest smoke
        run: |
          pip install -r requirements.txt
          pytest -q
        working-directory: api-test
        env:
          API_BASE_URL: http://127.0.0.1:8080

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api-test/report.html
          retention-days: 7

  # ---- Job 4: infra-lint (the ONLY `docker compose config` in CI) ----
  infra-lint:
    name: Infra (compose + otel)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 三个 compose 文件对少数变量用 ${VAR:?} 强制必填（防误用默认口令上线）；CI 无 .env，
    # 故在 **job 级** 给占位值。必须放 job 级：本 job 里有**两处**会执行 `docker compose config`
    # （下面的 lint 步骤 + 更下面的「npm 脚本引用的服务是否存在」校验步骤），
    # 若挂在步骤级，后一个步骤拿不到变量 → compose config exit 1（2026-10-19 真实踩到并修）。
    env:
      JWT_SECRET: ci-lint-placeholder
      GRAFANA_ADMIN_USER: ci-lint-placeholder
      GRAFANA_ADMIN_PASSWORD: ci-lint-placeholder
      MYSQL_ROOT_PASSWORD: ci-lint-placeholder
      DB_PASSWORD: ci-lint-placeholder
      MINIO_ROOT_USER: ci-lint-placeholder
      MINIO_ROOT_PASSWORD: ci-lint-placeholder
      MINIO_ACCESS_KEY: ci-lint-placeholder
      MINIO_SECRET_KEY: ci-lint-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Lint docker-compose (syntax only, no env needed)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.full.yml config -q
          docker compose -f docker-compose.demo.yml config -q

      - name: Guard backend timezone (TZ contract)
        run: |
          # 时区契约：backend 的 JVM 必须与 mysql 容器同一时区（CST）。
          # 原因（2026-10-26 线上事故）：Java 用 LocalDateTime.now() 写 play_history.played_at /
          # updated_at，而 created_at 走 MySQL 的 DEFAULT CURRENT_TIMESTAMP。mysql 容器一直是
          # CST，唯独 backend 没声明 TZ（UTC）→ 同一行两种时间差 8 小时，App「最近播放」全错。
          # 三份 compose 都要查：本地栈 / full(OTel) 栈 / 云上 demo 栈，任一份漏了都会复发。
          set -euo pipefail
          for f in docker-compose.yml docker-compose.full.yml docker-compose.demo.yml; do
            docker compose -f "$f" config --format json > "/tmp/cfg-$(basename "$f").json"
          done
          python3 << 'PY'
          import json, sys

          files = ["docker-compose.yml", "docker-compose.full.yml", "docker-compose.demo.yml"]
          bad = []
          for f in files:
              with open(f"/tmp/cfg-{f}.json") as fh:
                  cfg = json.load(fh)
              env = cfg["services"]["backend"].get("environment") or {}
              tz = env.get("TZ")
              print(f"{f}: backend.environment.TZ = {tz!r}")
              if tz != "Asia/Shanghai":
                  bad.append(f)
          if bad:
              print(f"::error::backend TZ 契约被破坏 {bad}：应为 Asia/Shanghai（见 2026-10-26「最近播放」时间错乱事故）")
              sys.exit(1)
          print("backend TZ contract ok")
          PY

      - name: Check nginx config syntax
        run: |
          # dummy 证书 + host 映射，跑真 nginx 做 -t（此前改坏 nginx.conf 不触发任何校验）
          mkdir -p /tmp/nginx-t/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/nginx-t/certs/privkey.pem \
            -out /tmp/nginx-t/certs/fullchain.pem \
            -subj "/CN=ci.local" >/dev/null 2>&1
          # nginx/nginx.conf 是完整配置（含 user/events/http），要替换主配置而非放进 conf.d
          # upstream 主机名在 CI 里不存在 → 用 --add-host 指向回环，只校验语法
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host musicapi:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v /tmp/nginx-t/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t

      - name: Check npm docker scripts reference real compose services
        run: |
          python3 << 'PY'
          import json, re, subprocess, sys
          services = set(subprocess.run(
              ['docker', 'compose', '-f', 'docker-compose.yml', 'config', '--services'],
              capture_output=True, text=True, check=True).stdout.split())
          scripts = json.load(open('package.json'))['scripts']
          bad = []
          for name, cmd in scripts.items():
              for m in re.finditer(r'docker compose up -d ([\w\- ]+)', cmd):
                  for svc in m.group(1).split():
                      if svc.startswith('-'):
                          continue  # 跳过 --build 之类的参数
                      if svc not in services:
                          bad.append(f"{name} -> {svc}")
          if bad:
              print("::error::npm docker 脚本引用了不存在的服务: " + ", ".join(bad))
              sys.exit(1)
          print(f"npm docker 脚本引用的服务全部存在（compose 共 {len(services)} 个）")
          PY

      - name: Validate otel-collector config YAML syntax
        run: |
          python3 -c 'import yaml; yaml.safe_load(open("docker-data/otel-collector-config.yaml")); print("otel-collector-config.yaml: YAML ok")'

      - name: Check otel tail_sampling policies present
        run: |
          python3 << 'PY'
          import yaml, sys
          cfg = yaml.safe_load(open('docker-data/otel-collector-config.yaml'))
          policies = cfg.get('processors', {}).get('tail_sampling', {}).get('policy', [])
          names = {p.get('name') for p in policies}
          expected = {'always-sample-errors', 'sample-slow', 'sample-low-throughput'}
          missing = expected - names
          if missing:
              print(f"::error::otel tail_sampling missing policies: {missing}")
              sys.exit(1)
          print(f"tail_sampling policies ok: {names}")
          traces_procs = cfg.get('service', {}).get('pipelines', {}).get('traces', {}).get('processors', [])
          if 'memory_limiter' not in traces_procs:
              print("::warning::traces pipeline missing memory_limiter")
          else:
              print(f"traces processors: {traces_procs}")
          PY

  # ---- Job 6: Docker 镜像构建（PR 只 build；push/tag 时同时发布到 GHCR）----
  # 目的：Dockerfile / compose build 配置坏了要在 CI 暴露，而不是等发版在云服务器上才发现。
  # P1-12：push 事件额外把镜像推到 ghcr.io/<owner>/vibemusic-<svc>:<commit sha>（不可变 tag），
  #        云端 scripts/deploy-backend.sh --from-registry 只 pull、不在 1.6G 机器上构建/传 300MB tar；
  #        回滚 = 换 tag。镜像带 org.opencontainers.image.revision label，云端据此验「拉到的就是那个提交」。
  # 覆盖 compose 里真正会被 build 的两个镜像（也是本仓仅有的两个在编镜像）：
  #   musicapi（Express BFF）、backend（Spring Boot，COPY target/*.jar）。
  # 成本取舍：PR 上不跑（省分钟数），只跑 main push / tag / 手动；tag 上跑=发版前先验镜像。
  # 不构建 nginx/Dockerfile：三个 compose 的 nginx 服务都用官方镜像 + 挂载 nginx.conf
  #   （配置语法已由 infra-lint 用真 nginx -t 校验），该文件无任何 compose 引用，且仓库根
  #   无 .dockerignore → 构建 context 会是整个仓库（含 docker-data/node_modules），白烧几分钟。
  docker-build:
    name: Docker images (build + publish to GHCR)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR (image payload; unit tests gated by backend job)
        run: mvn -B -DskipTests package
        working-directory: vibeMusic-backend
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Check every compose build context / Dockerfile exists
        env:
          JWT_SECRET: ci-lint-placeholder
          GRAFANA_ADMIN_USER: ci-lint-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-lint-placeholder
          MYSQL_ROOT_PASSWORD: ci-lint-placeholder
          DB_PASSWORD: ci-lint-placeholder
          MINIO_ROOT_USER: ci-lint-placeholder
          MINIO_ROOT_PASSWORD: ci-lint-placeholder
          MINIO_ACCESS_KEY: ci-lint-placeholder
          MINIO_SECRET_KEY: ci-lint-placeholder
        run: |
          python3 << 'PY'
          import json, os, subprocess, sys

          missing, builds = [], 0
          for compose in ('docker-compose.yml', 'docker-compose.full.yml', 'docker-compose.demo.yml'):
              cfg = json.loads(subprocess.run(
                  ['docker', 'compose', '-f', compose, 'config', '--format', 'json'],
                  capture_output=True, text=True, check=True).stdout)
              for name, svc in cfg.get('services', {}).items():
                  build = svc.get('build')
                  if not build:
                      continue
                  builds += 1
                  ctx = build.get('context', '.')
                  dockerfile = build.get('dockerfile', 'Dockerfile')
                  if not os.path.isdir(ctx):
                      missing.append(f"{compose}:{name} context {ctx}")
                  elif not os.path.isfile(os.path.join(ctx, dockerfile)):
                      missing.append(f"{compose}:{name} {os.path.join(ctx, dockerfile)}")
          if missing:
              print("::error::compose build 指向的 context/Dockerfile 不存在: " + ", ".join(missing))
              sys.exit(1)
          print(f"compose 的 {builds} 处 build 定义指向的 context/Dockerfile 全部存在")
          PY

      # label 是云端唯一的「内容 ↔ 提交」绑定证据：--from-registry 部署会断言它等于 git sha
      - name: Build musicapi image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t vibemusic-musicapi:ci ./musicapi

      - name: Build backend image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t vibemusic-backend:ci ./vibeMusic-backend

      # 镜像"真的装进了东西"的旁证：网关入口能过 node 语法检查，后端 jar 在镜像里且非空
      - name: Image payload sanity
        run: |
          docker run --rm --entrypoint node vibemusic-musicapi:ci --check server.js
          docker run --rm --entrypoint sh vibemusic-backend:ci -c 'test -s /app/app.jar'

      # ---- P1-12：发布到 GHCR，tag 只用 commit sha（不可变；不推 latest，避免"tag 动了内容没动"）----
      - name: Publish images to GHCR (immutable tag = commit sha)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          SHA="$GITHUB_SHA"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for svc in backend musicapi; do
            src="vibemusic-${svc}:ci"
            dst="ghcr.io/${OWNER}/vibemusic-${svc}:${SHA}"
            docker tag "$src" "$dst"
            echo "推 $dst"
            docker push "$dst"
          done
          # 推完立刻回查：manifest 里必须带 revision label 的证据是「镜像存在且可被匿名读取」
          docker manifest inspect "ghcr.io/${OWNER}/vibemusic-backend:${SHA}" >/dev/null
          echo "ghcr.io/${OWNER}/vibemusic-backend:${SHA} 已发布"
