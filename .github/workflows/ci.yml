# vibeMusic unified CI — single workflow replacing backend-ci / frontend-ci /
# musicapi-ci / test.yml (merged Q2b). 3 parallel test jobs + 1 infra-lint.
# deploy.yml keeps artifact-build only (no test duplication here).
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'vibeMusic-backend/**'
      - 'vibemusic-web/**'
      - 'musicapi/**'
      - 'api-test/**'
      - 'docker-compose*.yml'
      - 'docker-data/**'
      # nginx / monitoring / scripts 改动此前不触发任何 job（改坏反代配置无人发现）
      - 'nginx/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'vibeMusic-backend/**'
      - 'vibemusic-web/**'
      - 'musicapi/**'
      - 'api-test/**'
      - 'docker-compose*.yml'
      - 'docker-data/**'
      - 'nginx/**'
      - 'monitoring/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job 1: Spring Boot backend (JaCoCo 60% gate runs on `verify`) ----
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vibeMusic-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Verify (JaCoCo 60% gate on verify)
        run: mvn -B verify -DskipTests=false
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          # test-only, never production：32 个零字节的 base64 假密钥，仅供测试加载 CookieCryptoService
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Upload Surefire test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: vibeMusic-backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: vibeMusic-backend/target/site/jacoco/
          retention-days: 7

  # ---- Job 2: Vue 3 frontend (build + Vitest) ----
  frontend:
    name: Frontend (Vite build + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vibemusic-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vibemusic-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.cjs" ] || [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ]; then
            echo "ESLint config found, running (hard gate)..."
            npx eslint .
          else
            echo "No ESLint config, skipping (project is pure JS without eslint by design)"
          fi

      - name: Typecheck (vue-tsc, 硬门禁；测试文件由 vitest 覆盖故排除在 checkJs 外——checkJs 无法建模 vi.mock)
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Run tests (Vitest)
        run: npx vitest run --reporter=verbose --coverage

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vibemusic-web/dist/
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: vibemusic-web/coverage/
          retention-days: 7

  # ---- Job 3: Express BFF gateway (offline stub tests, no live server) ----
  # NOTE: test/server.test.js is deliberately excluded — it requires a live
  # server on :3000. All other test files are self-contained (node:test stubs)
  # and run per-file explicitly with --test-force-exit.
  gateway:
    name: Gateway (node --test, 12 files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: musicapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done

      - name: Run gateway tests (per-file, no live server)
        run: |
          node --test --test-force-exit test/cookie-endpoints-hardening.test.js \
            test/gateway-top10.test.js \
            test/netease-capability-probe.test.js \
            test/netease-ssrf.test.js \
            test/netease-user-cookie.test.js \
            test/qq-no-cookie.test.js \
            test/search-bili.test.js \
            test/search-cache-key-isolation.test.js \
            test/search-cache-regression.test.js \
            test/search-kugou.test.js \
            test/search-migu.test.js \
            test/search-qq.test.js

  # ---- Job 5: API smoke (pytest vs 实机 backend + mysql + redis + musicapi) ----
  # push 才跑（省 PR 分钟数）；services 起真 mysql+redis，musicapi 与后端实机启动，
  # 健康检查放行后才跑 pytest；后端不可达时用例 skip 不爆红。
  # 必须起 musicapi：不起则五路 fanout 全空 → 搜索/推荐类用例大面积 skip，
  # job 看着绿但其实没验到搜索链路（无 Cookie 时 QQ 走无 Cookie 正常态、网易降级）。
  api-test:
    name: API smoke (pytest vs live backend)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: vibemusic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p123456"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api-test/requirements.txt

      - name: Build backend (skip unit tests; gate lives in backend job)
        run: mvn -B -DskipTests package
        working-directory: vibeMusic-backend
        env:
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Set up Node 20 (musicapi gateway)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      - name: Start musicapi gateway (no cookies → 上游降级)
        run: |
          npm ci
          nohup node server.js > /tmp/musicapi.log 2>&1 &
          echo $! > /tmp/musicapi.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "musicapi up after ${i}x2s"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::musicapi 未在 60 秒内就绪"
              tail -n 80 /tmp/musicapi.log
              exit 1
            fi
            sleep 2
          done
        working-directory: musicapi

      - name: Start backend against services
        run: |
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/auth/health >/dev/null; then
              echo "backend up after ${i}x5s"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "::error::backend 未在 5 分钟内就绪"
              tail -n 100 /tmp/backend.log
              exit 1
            fi
            sleep 5
          done
        working-directory: vibeMusic-backend
        env:
          SPRING_PROFILES_ACTIVE: docker
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: 123456
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-32bytes-long!
          COOKIE_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Run pytest smoke
        run: |
          pip install -r requirements.txt
          pytest -q
        working-directory: api-test
        env:
          API_BASE_URL: http://127.0.0.1:8080

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api-test/report.html
          retention-days: 7

  # ---- Job 4: infra-lint (the ONLY `docker compose config` in CI) ----
  infra-lint:
    name: Infra (compose + otel)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint docker-compose (syntax only, no env needed)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.full.yml config -q
          docker compose -f docker-compose.demo.yml config -q
        env:
          # demo/full 变体对少数变量用 ${VAR:?} 强制必填（防止误用默认口令上线），
          # CI 无 .env，这里给占位值让语法校验可通过
          JWT_SECRET: ci-lint-placeholder
          GRAFANA_ADMIN_PASSWORD: ci-lint-placeholder

      - name: Check nginx config syntax
        run: |
          # dummy 证书 + host 映射，跑真 nginx 做 -t（此前改坏 nginx.conf 不触发任何校验）
          mkdir -p /tmp/nginx-t/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/nginx-t/certs/privkey.pem \
            -out /tmp/nginx-t/certs/fullchain.pem \
            -subj "/CN=ci.local" >/dev/null 2>&1
          # nginx/nginx.conf 是完整配置（含 user/events/http），要替换主配置而非放进 conf.d
          # upstream 主机名在 CI 里不存在 → 用 --add-host 指向回环，只校验语法
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host musicapi:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v /tmp/nginx-t/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t

      - name: Check npm docker scripts reference real compose services
        run: |
          python3 << 'PY'
          import json, re, subprocess, sys
          services = set(subprocess.run(
              ['docker', 'compose', '-f', 'docker-compose.yml', 'config', '--services'],
              capture_output=True, text=True, check=True).stdout.split())
          scripts = json.load(open('package.json'))['scripts']
          bad = []
          for name, cmd in scripts.items():
              for m in re.finditer(r'docker compose up -d ([\w\- ]+)', cmd):
                  for svc in m.group(1).split():
                      if svc.startswith('-'):
                          continue  # 跳过 --build 之类的参数
                      if svc not in services:
                          bad.append(f"{name} -> {svc}")
          if bad:
              print("::error::npm docker 脚本引用了不存在的服务: " + ", ".join(bad))
              sys.exit(1)
          print(f"npm docker 脚本引用的服务全部存在（compose 共 {len(services)} 个）")
          PY

      - name: Validate otel-collector config YAML syntax
        run: |
          python3 -c 'import yaml; yaml.safe_load(open("docker-data/otel-collector-config.yaml")); print("otel-collector-config.yaml: YAML ok")'

      - name: Check otel tail_sampling policies present
        run: |
          python3 << 'PY'
          import yaml, sys
          cfg = yaml.safe_load(open('docker-data/otel-collector-config.yaml'))
          policies = cfg.get('processors', {}).get('tail_sampling', {}).get('policy', [])
          names = {p.get('name') for p in policies}
          expected = {'always-sample-errors', 'sample-slow', 'sample-low-throughput'}
          missing = expected - names
          if missing:
              print(f"::error::otel tail_sampling missing policies: {missing}")
              sys.exit(1)
          print(f"tail_sampling policies ok: {names}")
          traces_procs = cfg.get('service', {}).get('pipelines', {}).get('traces', {}).get('processors', [])
          if 'memory_limiter' not in traces_procs:
              print("::warning::traces pipeline missing memory_limiter")
          else:
              print(f"traces processors: {traces_procs}")
          PY
