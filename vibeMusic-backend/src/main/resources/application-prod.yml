# ===== vibeMusic 生产环境配置 =====
# 激活方式: SPRING_PROFILES_ACTIVE=prod
# 命令行: mvn spring-boot:run -Dspring-boot.run.profiles=prod

# ── 强制覆盖安全兜底 ──
jwt:
  secret: ${JWT_SECRET}  # prod 必须提供，缺失启动时报错

logging:
  level:
    com.vibemusic: info
    org.springframework.security: warn
    org.springframework.web: warn

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境禁止 SQL 日志

knife4j:
  enable: false  # 生产环境关闭 API 文档

# ── Actuator：只暴露必要端点 ──
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus  # 只保留监控必要端点
  endpoint:
    health:
      show-details: never  # 不暴露健康详情
