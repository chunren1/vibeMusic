# ===== vibeMusic 开发环境配置 =====
# 激活方式: spring.profiles.active=dev (默认)
# 命令行: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# 注意：DB_PASSWORD / REDIS_PASSWORD 需与 docker-compose 启动的中间件密码一致
# 无默认值：必须通过 .env / 系统环境变量显式提供，缺失即启动失败（不再回落到弱口令）

# ── 开发环境专用密钥（仅本地调试） ──
jwt:
  secret: ${JWT_SECRET:vibeMusic-dev-only-change-in-production}

spring:
  datasource:
    # 本地开发默认连接 Docker MySQL
    # 注意：MySQL 密码以首次初始化时为准，Docker 数据卷存在后不会随 .env 变化
    # 必须显式提供 DB_PASSWORD（缺失即启动失败），不再使用弱默认口令兜底
    password: ${DB_PASSWORD}
  data:
    redis:
      # 本地开发默认连接 Docker Redis，密码来自 .env 的 REDIS_PASSWORD
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.vibemusic: debug
    org.springframework.security: debug
    org.springframework.web: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ── MinIO 本地开发 ──
storage:
  minio:
    # MinIO 凭证以首次初始化时为准，Docker 数据卷存在后不会随 .env 变化
    access-key: ${MINIO_ACCESS_KEY:rustfsadmin}
    secret-key: ${MINIO_SECRET_KEY}

# ── AI 助手（DeepSeek 官方 API） ──
# 注意：本地 dev 模式不加载 .env（Docker 部署才注入），故留空默认值，
# 缺环境变量时仅 AI 助手降级，不影响服务启动；要启用 AI 需在启动环境设置 AI_API_KEY
ai:
  api-key: ${AI_API_KEY:}

knife4j:
  enable: true
