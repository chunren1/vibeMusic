# ===== vibeMusic Docker 生产环境配置 =====
# 激活方式: SPRING_PROFILES_ACTIVE=docker
# 由 docker-compose 自动设置

# Flyway 云端接管（2026-09-28）：V1–V7 已全部幂等化，
# 云库实测仅缺 V2/V3_1 的 3 个 song 索引 + url 扩容，其余皆是空操作；
# 首次启动以 baseline-version=1 建基线并补齐缺失项，此后 V8+ 正常版本化。
# 2026-10-25 开启 validate：云库 checksum 已逐条核对与本地一致（V2–V8 全等，V1 为 baseline），
# 无需 repair。历史手管期遗留问题已消除，此后改历史迁移文件会在启动时立即失败。
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

logging:
  level:
    com.vibemusic: info
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 关闭 MyBatis SQL 日志（生产环境不需要）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 生产环境关闭 Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
