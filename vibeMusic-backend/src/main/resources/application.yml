server:
  port: 8080

  # ── Tomcat 线程/连接收敛（2026-10-22 资源重排）──
  # 生产事实：云主机 2 vCPU / 1.6 GiB（swap 已用 527MB），后端容器 limit 768MB / 1 CPU；
  # 改前无任何 server.tomcat 配置 → Spring Boot 默认 max-threads=200。
  # 并发上限由「内存 + 上游预算」决定，不是 CPU（照搬 CPU 核数反而会放开不该放开的并发）：
  #   · 每线程栈 1MB（-Xss 默认）：200 线程 = 200MB 栈，叠加堆(~356MB RSS)/元空间/直接内存
  #     必然撞 768MB limit 被 OOMKilled；
  #   · 40 线程 ≈ 40MB 栈，余量留给 Hikari(8×~1MB) + HttpClient 池 + Netty/WebClient；
  #   · 业务侧：日请求 860（/stream 150），峰值 ~70 req/min ≈ 1.2 req/s，
  #     取链最坏 8s 预算 → 在途约 10 个请求，40 线程有 4 倍冗余。
  # 只加线程不加内存没有意义：上游 musicapi/网易/QQ 的连接数与超时预算才是真瓶颈。
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
    # 排队+连接上限：40 工作线程 + 50 排队 = 90 个并发请求的瞬时缓冲，
    # 超出由 Tomcat/OS 直接拒绝连接（快速失败），而不是在 JVM 里堆 200 个线程的栈。
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
    # 200 = 40 线程 × 5（HTTP/1.1 keep-alive 空闲连接占比通常 3-5 倍）；
    # 单机 ~1.2 req/s 的负载下，200 连接足以覆盖长轮询/流式播放，再高只是白占 fd 与内核内存。
    max-connections: ${TOMCAT_MAX_CONNECTIONS:200}

spring:
  application:
    name: vibeMusic-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vibemusic?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 2 vCPU / 单机 MySQL：连接数不是瓶颈，池大了只会让「并发查询」在 2 核上互相排队，
      # 还白占容器内存（每连接 ~1MB 栈 + 服务端线程）。8 = 2 核 × 4 倍冗余，
      # 峰值 ~1.2 req/s 的读多写少负载下实测绰绰有余（旧值 20 是单机时代的过量配置）。
      # 注意：docker-compose 里 DB_POOL_MAX_SIZE=20 会覆盖本默认值，发版时需同步。
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      max-lifetime: 600000
      idle-timeout: 300000
      leak-detection-threshold: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # 2026-10-25 开启：云库 flyway_schema_history 的 V2–V8 checksum 与本地迁移文件逐条实测一致
    # （V1 为 baseline 标记，不参与校验），无需 repair。开启后迁移文件被改动会在启动时立即失败，
    # 而不是静默漂移。新增迁移只能追加新版本号，禁止改历史文件。
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      # 显式设置连接超时：Spring Boot 4.0.6 在本项缺省时不注入 SocketOptions，
      # Lettuce 会回落到默认 10s 连接超时——Redis 不可达时请求会白等 10s 才降级。
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ── 应用线程池（ThreadPoolConfig，prefix=threadpool）──
# 全部可在本文件覆盖（或注入同名环境变量：THREADPOOL_SEARCH_CORE 等，Spring 松散绑定）。
# 尺寸推导见 ThreadPoolConfig 类注释：容器 2 vCPU / 768MB，40 线程 Tomcat ≈ 40MB 栈，
# 三个池合计 44+2+24=70 个任务上限 ≈ 70MB 栈，仍在 768MB 预算内。
threadpool:
  # 搜索池：单次搜索 fan-out 5 个音源，峰值 1.2 req/s × 最坏 3s 搜索超时 ≈ 4 请求 ≈ 20 任务在途。
  # core 8 吃稳态、max 12 吸收突发、queue 32 兜分钟级洪峰（44 任务上限≈44MB 栈）。
  # 旧值 20/40/100：40 线程 + 100 队列 ≈ 140 个任务在途，与 1.6G 主机不匹配；
  # 且 100 的队列意味着排队 30s+ 才轮到（3s 上游超时的 10 倍），对用户等价于超时。
  search-core: 8
  search-max: 12
  search-queue: 32
  search-keep-alive: 60
  # 预热池：core=max=1 是「串行限速」而不是容量（14 个关键词串行 + sleep 1.5s ≈ 21s）。
  # 不与搜索池合并：合并会让预热长期占用搜索线程，用户搜索被后台预热拖慢。
  # queue 2：提交方只有 @PostConstruct 的 1 个任务，旧值 20 纯属浪费；满了 DiscardOldest 静默丢。
  warm-core: 1
  warm-max: 1
  warm-queue: 2
  warm-keep-alive: 60
  # 取链池：单次播放并行探测 3 个音质档（exhigh/higher/standard），/stream 最坏重试 5 次。
  # 8 线程 = 2 个并发流 × 3 档 + 2 个重试位（旧值 3 会把并行探测退化成排队，
  # 8s 总预算内 Abort 掉最需要的那档 → 表现为"有歌没链接"）。
  # 固定 8（core=max）避免扩容抖动；queue 16 兜一轮重试；满了 AbortPolicy 快速失败、调用方降级。
  get-url-core: 8
  get-url-max: 8
  get-url-queue: 16
  get-url-keep-alive: 60

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000        # 15 分钟
  refresh-expiration: 604800000    # 7 天

ai:
  api-key: ${AI_API_KEY:}
  api-url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-v4-flash}
  thinking-mode: ${AI_THINKING_MODE:disabled}
  # 单次请求的 AI 总预算（ms）：Function Calling 最多 3 次 LLM 调用共享这一份预算，
  # 每次调用超时 = min(AI 客户端 60s, 剩余预算)，耗尽即降级、不再发起新调用。
  # 代码侧有同名默认值 45000，缺配置不会导致启动失败。
  total-budget-ms: ${AI_TOTAL_BUDGET_MS:45000}
  # 流式首包（响应头）超时（ms），必须小于 total-budget-ms；上游不回首包时不再无限挂起。
  stream-first-byte-timeout-ms: ${AI_STREAM_FIRST_BYTE_TIMEOUT_MS:20000}

netease:
  api:
    base-url: ${MUSICAPI_URL:http://localhost:3000}
    # 注：原 timeout: 10000 为死配置（全仓无 getTimeout 引用），已删除；
    # HTTP 超时按用途收敛在 RestTemplateConfig（默认 5s / 搜索 3s / 流 30s / AI 60s）。

# 音频流代理 CDN 域名白名单（逗号分隔，支持 *.xxx.com 通配符）
stream:
  cdn-whitelist: ${STREAM_CDN_WHITELIST:*.music.126.net,*.gtimg.cn,
    *.stream.qqmusic.qq.com,*.tc.qq.com,*.tencentmusic.com,*.migu.cn,
    *.bilivideo.com,*.hdslb.com}

storage:
  # 对象存储总开关：缺省关闭（云上只跑 backend/musicapi/mysql/redis，MinIO 已下线）。
  # 关闭时 StorageService 不发任何网络调用，播放/下载全部走上游直连代理。
  # 本地演示（带 MinIO 的完整栈）用 STORAGE_ENABLED=true 开启。
  enabled: ${STORAGE_ENABLED:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:vibemusic}
    data-path: ${MINIO_DATA_PATH:minio-data}

# 贵端点限流（P0-3）：只拦 search / stream，按身份计数（已登录用户 > 设备 ID > IP）
# 关闭方式：rate-limit.enabled=false（或环境变量 RATE_LIMIT_ENABLED=false）
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  # 搜索一次扇出 5 个上游平台，20 次/分钟足够正常用户翻页
  search-per-min: ${RATE_LIMIT_SEARCH_PER_MIN:20}
  # 音频流含拖拽产生的 Range 请求，60 次/分钟对单曲循环也够用
  stream-per-min: ${RATE_LIMIT_STREAM_PER_MIN:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.vibemusic

# Actuator 监控: 暴露 health + prometheus + metrics 端点
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: when-authorized
      # compose 健康检查用 /actuator/health/liveness（非 K8s 环境需显式开启探针组）
      probes:
        enabled: true
  metrics:
    tags:
      application: vibemusic-backend
    distribution:
      percentiles-histogram:
        search.latency: true
      percentiles:
        search.latency: 0.5,0.95,0.99
