server:
  port: 8080

spring:
  application:
    name: vibeMusic-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vibemusic?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 600000
      idle-timeout: 300000
      leak-detection-threshold: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000        # 15 分钟
  refresh-expiration: 604800000    # 7 天

ai:
  api-key: ${AI_API_KEY:}
  api-url: ${AI_API_URL:https://api.deepseek.com/chat/completions}
  model: ${AI_MODEL:deepseek-v4-flash}
  thinking-mode: ${AI_THINKING_MODE:disabled}

netease:
  api:
    base-url: ${MUSICAPI_URL:http://localhost:3000}
    timeout: 10000

# 音频流代理 CDN 域名白名单（逗号分隔，支持 *.xxx.com 通配符）
stream:
  cdn-whitelist: ${STREAM_CDN_WHITELIST:*.music.126.net,*.gtimg.cn,*.stream.qqmusic.qq.com,*.tc.qq.com,*.tencentmusic.com}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:vibemusic}
    data-path: ${MINIO_DATA_PATH:minio-data}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.vibemusic

# Actuator 监控: 暴露 health + prometheus + metrics 端点
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: vibemusic-backend
    distribution:
      percentiles-histogram:
        search.latency: true
      percentiles:
        search.latency: 0.5,0.95,0.99
