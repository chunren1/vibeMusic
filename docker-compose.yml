# ============================================================
# 通用日志配置（限制大小 + 轮转）
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-resources-small: &resources-small
  limits: { cpus: "0.5", memory: "256M" }
  reservations: { cpus: "0.25", memory: "128M" }

x-resources-medium: &resources-medium
  limits: { cpus: "1.0", memory: "512M" }
  reservations: { cpus: "0.5", memory: "256M" }

x-resources-large: &resources-large
  limits: { cpus: "2.0", memory: "2G" }
  reservations: { cpus: "1.0", memory: "1G" }

services:
  # ==========================
  # MySQL 8.0 — 关系数据库
  # ==========================
  mysql:
    image: mysql:8.0
    container_name: vibemusic-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: vibemusic
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    # MySQL 暴露端口以便宿主机本地后端连接（生产环境注释掉）
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
      - ./docker-data/mysql/data:/var/lib/mysql
      # 初始化 SQL（首次启动自动执行）
      - ./vibeMusic-backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 慢查询日志（超过 1 秒记录）
      - --slow_query_log=ON
      - --slow_query_log_file=/var/lib/mysql/slow.log
      - --long_query_time=1
      - --log_queries_not_using_indexes=ON
      - --log_slow_admin_statements=ON
    deploy:
      <<: *resources-large
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Redis 7 — 缓存 & 会话
  # ==========================
  redis:
    image: redis:7-alpine
    container_name: vibemusic-redis
    restart: unless-stopped
    logging: *default-logging
    # Redis 仅内部网络访问，不暴露到宿主机（本地调试时可取消注释）
    # ports:
    #   - "6379:6379"
    volumes:
      # 数据持久化
      - ./docker-data/redis/data:/data
      # 自定义配置
      - ./docker-data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass 
    deploy:
      <<: *resources-small
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


  # ==========================
  # Elasticsearch 8.11 — 全文搜索引擎
  # ==========================
  elasticsearch:
    image: elasticsearch:8.18.0
    container_name: vibemusic-es
    restart: unless-stopped
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:-ChangeMeES123!}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    # ES 仅内部网络访问，不暴露到宿主机（本地调试时可取消注释）
    # ports:
    #   - "9201:9200"
    volumes:
      # ES 数据
      - ./docker-data/elasticsearch/data:/usr/share/elasticsearch/data
      # IK 插件持久化
      - ./docker-data/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      # 启动脚本（含 IK 自动安装）
      - ./docker-data/elasticsearch/es-start.sh:/es-start.sh:ro
    command: ["/bin/bash", "/es-start.sh"]
    deploy:
      <<: *resources-large
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ==========================
  # musicapi — 网易云 + QQ 音乐统一 API 代理 (Node.js)
  # ==========================
  musicapi:
    build:
      context: ./musicapi
      dockerfile: Dockerfile
    image: vibemusic-musicapi:latest
    container_name: vibemusic-musicapi
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      # 音乐平台 Cookie（从 .env 注入）
      MUSIC_QQ_COOKIE: ${MUSIC_QQ_COOKIE:-{}}
      MUSIC_NETEASE_COOKIE: ${MUSIC_NETEASE_COOKIE:-}
    ports:
      - "3000:3000"
    deploy:
      <<: *resources-small
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================
  # MinIO 对象存储
  # ==========================
  minio:
    image: minio/minio:latest
    container_name: vibemusic-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rustfsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe456!}
      TZ: Asia/Shanghai
    # MinIO 仅内部网络访问，不暴露到宿主机（本地调试时可取消注释）
    # ports:
    #   # API 端口（S3 兼容）
    #   - "9000:9000"
    #   # Web 控制台
    #   - "9001:9001"
    volumes:
      # 对象数据持久化
      - ./docker-data/minio/data:/data
    command: server /data --console-address ":9001"
    deploy:
      <<: *resources-medium
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Spring Boot 后端 — vibeMusic API
  # ==========================
  backend:
    build:
      context: ./vibeMusic-backend
      dockerfile: Dockerfile
    image: vibemusic-backend:latest
    container_name: vibemusic-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      # 数据库
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 
      # Elasticsearch (带 xpack 认证)
      ES_URI: http://elastic:${ES_PASSWORD:-ChangeMeES123!}@elasticsearch:9200
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-rustfsadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ChangeMe456!}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-ChangeMeJWTSecretKey123!}
      # AI 助手
      AI_API_KEY: ${AI_API_KEY:-change-me}
      # musicapi (网易云 API 代理)
      MUSICAPI_URL: http://musicapi:3000
      # CORS 允许的来源（生产环境改为你的实际域名）
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:5173}
      # Profile
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    deploy:
      <<: *resources-medium
    networks:
      - vibemusic-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      musicapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================
  # ==========================
  # Nginx — 统一入口 & 反向代理（HTTPS）
  # ==========================
  nginx:
    image: nginx:1.27-alpine
    container_name: vibemusic-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS 证书
      - ./nginx/certs:/etc/nginx/certs:ro
      # 前端构建产物
      - ./vibemusic-web/dist:/usr/share/nginx/html:ro
      # 日志持久化
      - ./docker-data/nginx/logs:/var/log/nginx
      # 日志轮转配置
      - ./nginx/logrotate-nginx.conf:/etc/nginx/logrotate-nginx.conf:ro
      # 自定义入口脚本
      - ./nginx/docker-entrypoint.sh:/usr/local/bin/vibe-nginx-entrypoint.sh:ro
    command: ["nginx", "-g", "daemon off;"]
    entrypoint: ["/usr/local/bin/vibe-nginx-entrypoint.sh"]
    deploy:
      <<: *resources-small
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: vibemusic-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-rustfsadmin} ${MINIO_ROOT_PASSWORD:-ChangeMe456!};
      /usr/bin/mc mb --ignore-existing minio/vibemusic;
      echo 'Bucket vibemusic ready';
      exit 0;
      "
    networks:
      - vibemusic-net

  # ==========================
  # Prometheus — 指标采集与存储
  # ==========================
  prometheus:
    image: prom/prometheus:latest
    container_name: vibemusic-prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./docker-data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker-data/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./docker-data/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      <<: *resources-small
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================
  # Grafana — 指标可视化仪表盘
  # ==========================
  grafana:
    image: grafana/grafana:11.5.2
    container_name: vibemusic-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    ports:
      - "3001:3000"
    deploy:
      <<: *resources-small
    volumes:
      - ./docker-data/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker-data/grafana/data:/var/lib/grafana
    networks:
      - vibemusic-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================
  # Alertmanager — 告警通知管理
  # ==========================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: vibemusic-alertmanager
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9093:9093"
    volumes:
      - ./docker-data/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./docker-data/alertmanager/data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      <<: *resources-small
    networks:
      - vibemusic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================
  # MySQL 自动备份（每天凌晨 2 点，保留 30 天）
  # ==========================
  mysql-backup:
    image: mysql:8.0
    container_name: vibemusic-mysql-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    entrypoint: >
      /bin/bash -c "
      mkdir -p /backup;
      while true; do
        timestamp=$$(date +%Y%m%d-%H%M%S);
        mysqldump -h mysql -u root -p${MYSQL_ROOT_PASSWORD:-123456} --single-transaction --routines --triggers vibemusic
        | gzip > /backup/vibemusic-$$timestamp.sql.gz;
        echo \"[BACKUP] vibemusic-$$timestamp.sql.gz created\";
        # 删除 30 天前的备份
        find /backup -name 'vibemusic-*.sql.gz' -mtime +30 -delete;
        # 等待到凌晨 2 点
        sleep $$(( ($$(date -d 'tomorrow 02:00' +%s) - $$(date +%s)) ));
      done
      "
    volumes:
      - ./docker-data/backups/mysql:/backup
    networks:
      - vibemusic-net
    depends_on:
      mysql:
        condition: service_healthy

  # ==========================
  # Redis Exporter — 将 Redis 指标暴露为 Prometheus 格式
  # ==========================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: vibemusic-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: 
    networks:
      - vibemusic-net
    depends_on:
      redis:
        condition: service_healthy

  # ==========================
  # MySQL Exporter — 将 MySQL 指标暴露为 Prometheus 格式
  # ==========================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: vibemusic-mysql-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: root:${MYSQL_ROOT_PASSWORD:-123456}@(mysql:3306)/
    networks:
      - vibemusic-net
    depends_on:
      mysql:
        condition: service_healthy

# ==========================
# 独立数据卷（宿主机挂载）
# ==========================
networks:
  vibemusic-net:
    driver: bridge
    name: vibemusic-net
